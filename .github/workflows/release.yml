name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write   # tag/release e push do @semantic-release/git
  issues: write     # criar issue quando o release falhar (@semantic-release/github)
  id-token: write   # OIDC para Trusted Publishing no npm (sem NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.14+ exigido pelo Trusted Publishing; 24 traz npm >= 11.5.1
          node-version: "24"
          cache: "npm"
          # NÃO use registry-url aqui: conflita com auth do semantic-release / OIDC

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Menos log do npm evita buffer gigante (muitos arquivos em moves/ e pokemons/).
      # Sem NPM_TOKEN: o npm CLI autentica via OIDC (Trusted Publishing).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: error
        run: npx semantic-release
